<!DOCTYPE html>
<html>
<head>
    <title>آلة حاسبة</title>
    <style>
        body { text-align: center; font-family: Arial; background: #1e1e2e; color: white; margin-top: 50px; }
        input { padding: 10px; margin: 5px; font-size: 20px; width: 80px; text-align: center; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin: 5px; font-size: 18px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #45a049; }
        .result { margin-top: 20px; font-size: 24px; background: #2d2d3a; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>🧮 الآلة الحاسبة</h1>
    <input type="number" id="num1" placeholder="الرقم الأول">
    <input type="number" id="num2" placeholder="الرقم الثاني">
    <br>
    <button onclick="calculate('+')">➕ جمع</button>
    <button onclick="calculate('-')">➖ طرح</button>
    <button onclick="calculate('*')">✖️ ضرب</button>
    <button onclick="calculate('/')">➗ قسمة</button>
    <div class="result" id="result">النتيجة: --</div>

    <script>
        function calculate(operation) {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let result;
            if (isNaN(num1) || isNaN(num2)) {
                result = "⚠️ أدخل رقمين صحيحين";
            } else {
                switch(operation) {
                    case '+': result = num1 + num2; break;
                    case '-': result = num1 - num2; break;
                    case '*': result = num1 * num2; break;
                    case '/': result = num2 !== 0 ? num1 / num2 : "لا يمكن القسمة على صفر"; break;
                }
            }
            document.getElementById('result').innerHTML = `📊 النتيجة: ${result}`;
        }
    </script>
</body>
</html>
